<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CrewAI Shortcut</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0f172a" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  body{font-family:Arial,system-ui;background:#0f172a;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{width:min(92vw,520px);background:#111827;border:1px solid #334155;border-radius:20px;padding:22px;box-shadow:0 12px 40px #0008}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#cbd5e1;line-height:1.45;margin:8px 0}
  a.btn{display:block;text-align:center;text-decoration:none;font-weight:800;font-size:18px;color:#0f172a;background:#22d3ee;padding:16px;border-radius:14px;margin:16px 0}
  ol{color:#e2e8f0;padding-left:22px}
  li{margin:8px 0}
  code{background:#020617;padding:2px 6px;border-radius:6px;color:#a5f3fc}
</style>
</head>
<body>
  <div class="card">
    <h1>CrewAI one-tap opener</h1>
    <p>Tap the button to open CrewAI in Chrome.</p>
    <a class="btn" href="https://www.crewai.com/">OPEN CREWAI</a>
    <p><b>To add shortcut:</b></p>
    <ol>
      <li>Open the button in Chrome.</li>
      <li>Tap <code>⋮</code> → <code>Add to Home screen</code>.</li>
      <li>Name it <code>CrewAI</code> → tap <code>Add</code>.</li>
    </ol>
    <p>Android requires you to confirm the shortcut once; a page cannot add itself automatically.</p>
  </div>
</body>
</html>
